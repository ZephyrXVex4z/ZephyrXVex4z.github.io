<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan 3 Días — NetShare School</title>
  <style>
  :root {
    --bg-dark: #0f172a;
    --bg-card: #1e293b;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #4ade80;
    --success-glow: rgba(74, 222, 128, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 1.5rem;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999;
  }

  main {
    text-align: center;
    max-width: 500px;
    width: 100%;
    margin: auto;
    z-index: 1;
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    background: linear-gradient(to right, #ffffff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
  }

  .card {
    background-color: var(--bg-card);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .price-large {
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--accent);
    margin: 1rem 0;
    text-shadow: 0 0 20px var(--accent-glow);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    padding: 1rem;
    border-radius: 12px;
    transition: all 0.2s ease;
    margin-bottom: 1rem;
    cursor: pointer;
  }

  .btn-primary {
    background-color: var(--accent);
    color: #0f172a;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  .btn-success {
    background-color: #22c55e;
    color: white;
    box-shadow: 0 4px 14px var(--success-glow);
  }

  .btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--success-glow);
  }

  .btn-secondary {
    background-color: transparent;
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .btn-secondary:hover {
    background-color: rgba(255, 255, 255, 0.05);
    transform: translateY(-2px);
  }

  .price-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 1.2rem;
    border-radius: 12px;
    margin-bottom: 1rem;
    text-decoration: none;
    color: var(--text-main);
    transition: all 0.2s ease;
  }

  .price-option:hover {
    background-color: rgba(56, 189, 248, 0.05);
    border-color: var(--accent);
    transform: translateX(4px);
  }

  .option-days {
    font-weight: 700;
    font-size: 1.1rem;
  }

  .option-price {
    color: var(--accent);
    font-weight: 800;
    font-size: 1.2rem;
  }

  footer {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 2rem;
  }
</style>
</head>
<body>

<main>
  <h1 class="title">Plan Intermedio</h1>
  <p class="subtitle">Ideal para media semana de proyectos</p>

  <div class="card" style="border-color: rgba(56, 189, 248, 0.4);">
    <div style="font-size: 0.9rem; color: var(--accent); text-transform: uppercase; font-weight: 700;">Duración: 3 Días</div>
    <div class="price-large">$20<span style="font-size: 1.5rem; color: var(--text-main);"> MXN</span></div>
    
    <ul style="text-align: left; margin: 1.5rem 0; padding-left: 1.2rem; color: var(--text-muted); line-height: 1.8;">
      <li>Acceso ilimitado por 3 días consecutivos.</li>
      <li>Ahorras dinero en comparación al plan diario.</li>
      <li>Soporte rápido en caso de desconexión.</li>
    </ul>

    <a href="https://wa.me/529844681306?text=Hola!%20Me%20interesa%20el%20plan%20de%203%20dias%20por%2020%20pesos" target="_blank" class="btn btn-primary">
      Pedir Acceso Ahora ⚡
    </a>
  </div>

  <!-- BOTÓN VOLVER -->
  <a href="index.html" class="btn btn-secondary">
    ◀ Volver al Inicio
  </a>
</main>

<footer>
  <p>NetShare School · 2026</p>
</footer>

</body>
</html>
